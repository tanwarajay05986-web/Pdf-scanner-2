name: Build Attractive APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    # यहाँ हमने नया सर्वर लगाया है ताकि Deprecated वाली एरर न आए
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PWA Builder
        run: npm install -g @pwabuilder/cli

      - name: Create App Manifest
        run: |
          echo '{
            "name": "PDF Scanner Pro",
            "short_name": "PDF Scanner",
            "start_url": "index.html",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#667eea",
            "icons": [
              {
                "src": "https://raw.githubusercontent.com/nicedoc/pwabuilder-cli/main/test/fixtures/manifest/icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }' > manifest.json

      - name: Generate Android APK
        run: pwabuilder package ./manifest.json --platforms android --options '{"packageId":"com.tanwaraja.pdfscanner"}'

      - name: Upload APK to Artifacts
        # यहाँ हमने v3 की जगह v4 लगा दिया है
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Scanner-Pro-APK
          path: pwabuilder-android-*.zip
