name: Build PDF Scanner APK (Final Fix)

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize NPM Project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor with www folder
        # Yahan humne web-dir ko 'www' kar diya hai
        run: npx cap init "PDF Scanner" "com.tanwaraja.pdfscanner" --web-dir www

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-PDF-Scanner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
