name: Build PDF Scanner APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2026 ke liye latest Node.js version use karein
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Java (JDK 17) setup karein jo Android build ke liye zaroori hai
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize NPM Project
        run: npm init -y

      - name: Install Capacitor Core & Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: npx cap init "PDF Scanner" "com.tanwaraja.pdfscanner" --web-dir .

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build Debug APK using Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-PDF-Scanner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
